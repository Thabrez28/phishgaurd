databases:
  - name: phishguard-db
    databaseName: phishguard
    user: phishguard_user
    plan: free
    region: oregon

services:
  - type: web
    name: phishguard-live
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
