{% extends "base.html" %}
{% block title %}Register Operator Key{% endblock %}

{% block auth_content %}
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 24px;">
  <div class="glass-panel" style="width: 100%; max-width: 460px; padding: 40px 36px; text-align: center;">
    <div style="width: 58px; height: 58px; margin: 0 auto 16px; background: linear-gradient(135deg, #0284c7 0%, #00f2fe 100%); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.7rem; color: #fff; box-shadow: 0 0 24px rgba(0, 242, 254, 0.4);">
      <i class="fas fa-user-plus"></i>
    </div>
    
    <h2 class="cyber-glow-text" style="font-size: 1.5rem; font-weight: 800; letter-spacing: 0.04em;">ENROLL OPERATOR</h2>
    <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.08em;">Create PhishGuard Identity Credentials</p>

    <form method="POST" action="{{ url_for('auth.register') }}" style="text-align: left;">
      <div style="margin-bottom: 16px;">
        <label class="cyber-label" for="username">Operator Handle (Username)</label>
        <input type="text" id="username" name="username" class="cyber-input" placeholder="e.g. analyst_sarah" value="{{ username or '' }}" required autofocus>
      </div>

      <div style="margin-bottom: 16px;">
        <label class="cyber-label" for="email">Official Email Address</label>
        <input type="email" id="email" name="email" class="cyber-input" placeholder="sarah@soc.cyber.org" value="{{ email or '' }}" required>
      </div>

      <div style="margin-bottom: 16px;">
        <label class="cyber-label" for="password">Master Password (min 8 chars)</label>
        <input type="password" id="password" name="password" class="cyber-input" placeholder="••••••••••••" required>
      </div>

      <div style="margin-bottom: 24px;">
        <label class="cyber-label" for="confirm_password">Confirm Master Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="cyber-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-cyber" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem;">
        <i class="fas fa-shield-check"></i> Generate & Enroll Operator
      </button>
    </form>

    <div style="margin-top: 24px; font-size: 0.82rem; color: var(--text-subtle);">
      Already possess credentials? 
      <a href="{{ url_for('auth.login') }}" style="color: var(--cyan-core); text-decoration: none; font-weight: 600;">Sign in to SOC</a>
    </div>
  </div>
</div>
{% endblock %}
